<svg xmlns="http://www.w3.org/2000/svg" width="1200.0" height="1750" viewBox="0 0 1200.0 1750"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="black"/></marker></defs><text x="600.0" y="35" font-size="30" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Лабораторная работа №1 · Вариант №3 · noob</text><text x="600.0" y="80" font-size="24" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Блок-схема по листингу из отчёта</text><polyline points="545.0,310.0 545.0,410.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="545.0,480.0 545.0,580.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="545.0,650.0 545.0,750.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="545.0,820.0 545.0,920.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="545.0,990.0 545.0,1090.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="545.0,1160.0 545.0,1260.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="545.0,1330.0 545.0,1430.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="280.0" y="240.0" width="530" height="70" rx="35.0" fill="white" stroke="black" stroke-width="1.7"/><text x="545.0" y="275.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">Начало</text><polygon points="165.0,410.0 925.0,410.0 925.0,480.0 165.0,480.0" fill="white" stroke="black" stroke-width="1.7"/><text x="545.0" y="445.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">from math import log, sin</text><text x="165.0" y="389.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 1</text><polygon points="165.0,580.0 925.0,580.0 925.0,650.0 165.0,650.0" fill="white" stroke="black" stroke-width="1.7"/><text x="545.0" y="615.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">x = 32.01</text><text x="165.0" y="559.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 4</text><polygon points="165.0,750.0 925.0,750.0 925.0,820.0 165.0,820.0" fill="white" stroke="black" stroke-width="1.7"/><text x="545.0" y="785.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">y = -0.4917</text><text x="165.0" y="729.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 5</text><polygon points="165.0,920.0 925.0,920.0 925.0,990.0 165.0,990.0" fill="white" stroke="black" stroke-width="1.7"/><text x="545.0" y="955.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">d = (x * y + sin(x)) / (abs(1 - y) * log(x))</text><text x="165.0" y="899.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 7</text><polygon points="156.0,1090.0 970.0,1090.0 934.0,1160.0 120.0,1160.0" fill="white" stroke="black" stroke-width="1.7"/><text x="545.0" y="1125.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">print(&quot;Результат = &quot; + str(round(d, 4)))</text><text x="120.0" y="1069.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 8</text><polygon points="156.0,1260.0 970.0,1260.0 934.0,1330.0 120.0,1330.0" fill="white" stroke="black" stroke-width="1.7"/><text x="545.0" y="1295.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">print(&quot;Целая часть = &quot; + str(int(d)))</text><text x="120.0" y="1239.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 9</text><rect x="280.0" y="1430.0" width="530" height="70" rx="35.0" fill="white" stroke="black" stroke-width="1.7"/><text x="545.0" y="1465.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">Конец</text><text x="600.0" y="1725" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Номера строк соответствуют листингу отчёта. L — парные границы цикла.</text></svg>