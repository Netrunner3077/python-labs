<svg xmlns="http://www.w3.org/2000/svg" width="1200.0" height="1799" viewBox="0 0 1200.0 1799"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="black"/></marker></defs><text x="600.0" y="35" font-size="30" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Лабораторная работа №1 · Вариант №25 · noob</text><text x="600.0" y="80" font-size="24" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Блок-схема по листингу из отчёта</text><polyline points="545.0,310.0 545.0,410.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="545.0,480.0 545.0,580.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="545.0,650.0 545.0,750.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="545.0,820.0 545.0,920.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="545.0,1039.0 545.0,1139.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="545.0,1209.0 545.0,1309.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="545.0,1379.0 545.0,1479.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="280.0" y="240.0" width="530" height="70" rx="35.0" fill="white" stroke="black" stroke-width="1.7"/><text x="545.0" y="275.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">Начало</text><polygon points="165.0,410.0 925.0,410.0 925.0,480.0 165.0,480.0" fill="white" stroke="black" stroke-width="1.7"/><text x="545.0" y="445.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">from math import copysign, pi, sin</text><text x="165.0" y="389.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 1</text><polygon points="165.0,580.0 925.0,580.0 925.0,650.0 165.0,650.0" fill="white" stroke="black" stroke-width="1.7"/><text x="545.0" y="615.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">x = 20.356</text><text x="165.0" y="559.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 4</text><polygon points="165.0,750.0 925.0,750.0 925.0,820.0 165.0,820.0" fill="white" stroke="black" stroke-width="1.7"/><text x="545.0" y="785.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">y = 0.523</text><text x="165.0" y="729.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 5</text><polygon points="165.0,920.0 925.0,920.0 925.0,1039.0 165.0,1039.0" fill="white" stroke="black" stroke-width="1.7"/><text x="545.0" y="950.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">d = x * (x - y) * (4 * x + y) / (2.7 * (x - pi))</text><text x="545.0" y="979.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">↪  + copysign(abs(0.2 * x / sin(y)) ** (1 / 3), </text><text x="545.0" y="1008.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">↪ 0.2 * x / sin(y))</text><text x="165.0" y="899.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 7</text><polygon points="156.0,1139.0 970.0,1139.0 934.0,1209.0 120.0,1209.0" fill="white" stroke="black" stroke-width="1.7"/><text x="545.0" y="1174.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">print(&quot;Результат = &quot; + str(round(d, 4)))</text><text x="120.0" y="1118.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 8</text><polygon points="156.0,1309.0 970.0,1309.0 934.0,1379.0 120.0,1379.0" fill="white" stroke="black" stroke-width="1.7"/><text x="545.0" y="1344.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">print(&quot;Целая часть = &quot; + str(int(d)))</text><text x="120.0" y="1288.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 9</text><rect x="280.0" y="1479.0" width="530" height="70" rx="35.0" fill="white" stroke="black" stroke-width="1.7"/><text x="545.0" y="1514.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">Конец</text><text x="600.0" y="1774" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Номера строк соответствуют листингу отчёта. L — парные границы цикла.</text></svg>