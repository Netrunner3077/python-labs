<svg xmlns="http://www.w3.org/2000/svg" width="2475.0" height="2190" viewBox="0 0 2475.0 2190"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="black"/></marker></defs><text x="1237.5" y="35" font-size="30" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Лабораторная работа №1 · Вариант №14 · basic</text><text x="1237.5" y="80" font-size="24" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Блок-схема по листингу из отчёта</text><polyline points="620.0,310.0 620.0,410.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,480.0 620.0,580.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,650.0 620.0,750.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,820.0 620.0,920.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,990.0 620.0,1090.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="1120.0,1165.0 1413.0,1165.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,1240.0 620.0,1340.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="1820.0,1210.0 1820.0,1822 620.0,1822 620.0,1870.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,1430.0 620.0,1530.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,1600.0 620.0,1700.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,1770.0 620.0,1870.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="355.0" y="240.0" width="530" height="70" rx="35.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="275.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">Начало</text><polygon points="240.0,410.0 1000.0,410.0 1000.0,480.0 240.0,480.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="445.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">import math</text><text x="240.0" y="389.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 1</text><polygon points="231.0,580.0 1045.0,580.0 1009.0,650.0 195.0,650.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="615.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">x = float(input(&quot;Введите значение x: &quot;))</text><text x="195.0" y="559.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 3</text><polygon points="231.0,750.0 1045.0,750.0 1009.0,820.0 195.0,820.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="785.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">y = float(input(&quot;Введите значение y: &quot;))</text><text x="195.0" y="729.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 4</text><polygon points="240.0,920.0 1000.0,920.0 1000.0,990.0 240.0,990.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="955.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">denominator = x * (x - y) * (2 * x + y)</text><text x="240.0" y="899.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 6</text><polygon points="620.0,1090.0 1120.0,1165.0 620.0,1240.0 120.0,1165.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="1165.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">if denominator == 0:</text><text x="120.0" y="1069.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 8</text><polygon points="1431.0,1120.0 2245.0,1120.0 2209.0,1210.0 1395.0,1210.0" fill="white" stroke="black" stroke-width="1.7"/><text x="1820.0" y="1150.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">print(&quot;Ошибка: знаменатель равен нулю. Функция </text><text x="1820.0" y="1179.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">↪ не определена.&quot;)</text><text x="1395.0" y="1099.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 9</text><polygon points="240.0,1340.0 1000.0,1340.0 1000.0,1430.0 240.0,1430.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="1370.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">numerator = x * math.exp(x * y) + 4 * </text><text x="620.0" y="1399.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">↪ math.cos(x) ** 2</text><text x="240.0" y="1319.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 11</text><polygon points="240.0,1530.0 1000.0,1530.0 1000.0,1600.0 240.0,1600.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="1565.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">u = numerator / denominator</text><text x="240.0" y="1509.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 13</text><polygon points="231.0,1700.0 1045.0,1700.0 1009.0,1770.0 195.0,1770.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="1735.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">print(f&quot;Значение функции u = {u:.4f}&quot;)</text><text x="195.0" y="1679.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 15</text><rect x="355.0" y="1870.0" width="530" height="70" rx="35.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="1905.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">Конец</text><text x="1266.5" y="1146.0" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Да</text><text x="638.0" y="1267.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">Нет · else:</text><text x="1237.5" y="2165" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Номера строк соответствуют листингу отчёта. L — парные границы цикла.</text></svg>