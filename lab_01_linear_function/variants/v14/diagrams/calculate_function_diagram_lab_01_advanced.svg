<rect x="227.0" y="23.0" width="136" height="34" rx="17.0" fill="#e7eff5" stroke="#26384b" stroke-width="1.5"/>
<text x="295.0" y="40.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="17" fill="#26384b">Начало</text>
<polygon points="162.5,83.0 442.5,83.0 427.5,137.0 147.5,137.0" fill="#f3f7fa" stroke="#26384b" stroke-width="1.5"/>
<text x="295.0" y="100.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="17" fill="#26384b">Ввод x и y с клавиатуры</text>
<text x="295.0" y="120.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="17" fill="#26384b">Повтор при нечисловом вводе</text>
<rect x="147.5" y="157.5" width="295" height="49" rx="2" fill="#ffffff" stroke="#26384b" stroke-width="1.5"/>
<text x="295.0" y="182.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="17" fill="#26384b">D = x · (x − y) · (2x + y)</text>
<polygon points="295.0,229.5 404.0,266.0 295.0,302.5 186.0,266.0" fill="#f0f4f8" stroke="#26384b" stroke-width="1.5"/>
<text x="295.0" y="266.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="17" fill="#26384b">|D| ≤ 10⁻¹⁵?</text>
<polygon points="459.0,242.5 660.0,242.5 645.0,289.5 444.0,289.5" fill="#f3f7fa" stroke="#26384b" stroke-width="1.5"/>
<text x="552.0" y="266.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="17" fill="#26384b">Сообщение об ошибке</text>
<rect x="147.5" y="335.0" width="295" height="60" rx="2" fill="#ffffff" stroke="#26384b" stroke-width="1.5"/>
<text x="295.0" y="355.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="17" fill="#26384b">N = x · exp(xy) + 4 · cos² x</text>
<text x="295.0" y="375.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="17" fill="#26384b">u = N / D</text>
<polygon points="150.0,424.5 455.0,424.5 440.0,473.5 135.0,473.5" fill="#f3f7fa" stroke="#26384b" stroke-width="1.5"/>
<text x="295.0" y="449.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="17" fill="#26384b">Вывод u (6 знаков после точки)</text>
<rect x="227.0" y="503.0" width="136" height="34" rx="17.0" fill="#e7eff5" stroke="#26384b" stroke-width="1.5"/>
<text x="295.0" y="520.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="17" fill="#26384b">Конец</text>
<text x="424" y="253" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#26384b" stroke="white" stroke-width="4" paint-order="stroke">Да</text>
<text x="318" y="315" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#26384b" stroke="white" stroke-width="4" paint-order="stroke">Нет</text>
