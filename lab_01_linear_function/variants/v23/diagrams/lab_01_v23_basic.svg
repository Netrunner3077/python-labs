<svg xmlns="http://www.w3.org/2000/svg" width="4100.0" height="4195" viewBox="0 0 4100.0 4195"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="black"/></marker></defs><text x="2050.0" y="35" font-size="30" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Лабораторная работа №1 · Вариант №23 · basic</text><text x="2050.0" y="80" font-size="24" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Блок-схема по листингу из отчёта</text><text x="1970.0" y="155" font-size="26" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Основная программа</text><polyline points="620.0,310.0 620.0,410.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,480.0 620.0,580.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,650.0 620.0,750.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,840.0 620.0,940.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,1030.0 620.0,1130.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,1220.0 620.0,1320.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,1390.0 620.0,1490.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,1560.0 620.0,1660.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,1560.0 620.0,1590 3820.0,1590 3820.0,2055 1820.0,2055 1820.0,2100.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="1120.0,1735.0 1515.0,1735.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,1810.0 620.0,1910.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,1810.0 620.0,1840 3820.0,1840 3820.0,2055 1820.0,2055 1820.0,2100.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="1820.0,1780.0 1820.0,1840 3820.0,1840 3820.0,2055 1820.0,2055 1820.0,2100.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,2000.0 620.0,2546.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,2000.0 620.0,2030 3820.0,2030 3820.0,2055 1820.0,2055 1820.0,2100.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="2320.0,2188.0 2640.0,2188.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="1820.0,2276.0 1820.0,2328 3020.0,2328 3020.0,2376.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="3400.0,2188.0 3750.0,2188.0 3750.0,2581.0 1027.0,2581.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,2616.0 620.0,2716.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,2806.0 620.0,2906.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,2976.0 620.0,3076.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,3166.0 620.0,3266.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="355.0" y="240.0" width="530" height="70" rx="35.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="275.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">Начало</text><polygon points="240.0,410.0 1000.0,410.0 1000.0,480.0 240.0,480.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="445.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">from math import copysign, log, sin</text><text x="240.0" y="389.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 1</text><polygon points="240.0,580.0 1000.0,580.0 1000.0,650.0 240.0,650.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="615.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">def calculate(x, y):</text><text x="240.0" y="559.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 4</text><polygon points="231.0,750.0 1045.0,750.0 1009.0,840.0 195.0,840.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="780.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">with open(&quot;input.txt&quot;, encoding=&quot;utf-8&quot;) as </text><text x="620.0" y="809.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">↪ file:</text><text x="195.0" y="729.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 8</text><polygon points="231.0,940.0 1045.0,940.0 1009.0,1030.0 195.0,1030.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="970.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">x, y = map(float, file.read().replace(&quot;,&quot;, </text><text x="620.0" y="999.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">↪ &quot;.&quot;).split())</text><text x="195.0" y="919.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 9</text><polygon points="240.0,1130.0 1000.0,1130.0 1000.0,1220.0 240.0,1220.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="1160.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">Выход из with (стр. 8)</text><text x="620.0" y="1189.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">Автоматическое закрытие файла</text><polygon points="240.0,1320.0 1000.0,1320.0 1000.0,1390.0 240.0,1390.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="1355.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">try:</text><text x="240.0" y="1299.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 11</text><polygon points="240.0,1490.0 1000.0,1490.0 1000.0,1560.0 240.0,1560.0" fill="white" stroke="black" stroke-width="1.7"/><polyline points="258.0,1490.0 258.0,1560.0" fill="none" stroke="black" stroke-width="1.7"/><polyline points="982.0,1490.0 982.0,1560.0" fill="none" stroke="black" stroke-width="1.7"/><text x="620.0" y="1525.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">d = calculate(x, y)</text><text x="240.0" y="1469.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 12</text><polygon points="620.0,1660.0 1120.0,1735.0 620.0,1810.0 120.0,1735.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="1735.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">if isinstance(d, complex):</text><text x="120.0" y="1639.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 13</text><rect x="1515.0" y="1690.0" width="610.0" height="90" rx="45.0" fill="white" stroke="black" stroke-width="1.7"/><text x="1820.0" y="1720.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">raise ValueError(&quot;ожидался вещественный </text><text x="1820.0" y="1749.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">↪ результат&quot;)</text><text x="1515.0" y="1669.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 14</text><polygon points="240.0,1910.0 1000.0,1910.0 1000.0,2000.0 240.0,2000.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="1940.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">result = f&quot;Результат = {d:.4f}\nЦелая часть = </text><text x="620.0" y="1969.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">↪ {int(d)}&quot;</text><text x="240.0" y="1889.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 15</text><polygon points="1820.0,2100.0 2320.0,2188.0 1820.0,2276.0 1320.0,2188.0" fill="white" stroke="black" stroke-width="1.7"/><text x="1820.0" y="2173.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">except (ArithmeticError, </text><text x="1820.0" y="2202.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">↪ ValueError) as error:</text><text x="1320.0" y="2079.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 16</text><polygon points="2640.0,2153.0 3400.0,2153.0 3400.0,2223.0 2640.0,2223.0" fill="white" stroke="black" stroke-width="1.7"/><text x="3020.0" y="2188.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">result = f&quot;Ошибка вычисления: {error}&quot;</text><text x="2640.0" y="2132.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 17</text><rect x="2728.0" y="2376.0" width="584.0" height="70" rx="35.0" fill="white" stroke="black" stroke-width="1.7"/><text x="3020.0" y="2411.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">Исключение передаётся вызывающему коду</text><polygon points="231.0,2546.0 1045.0,2546.0 1009.0,2616.0 195.0,2616.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="2581.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">print(result)</text><text x="195.0" y="2525.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 19</text><polygon points="231.0,2716.0 1045.0,2716.0 1009.0,2806.0 195.0,2806.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="2746.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">with open(&quot;result.txt&quot;, &quot;w&quot;, encoding=&quot;utf-8&quot;) </text><text x="620.0" y="2775.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">↪ as file:</text><text x="195.0" y="2695.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 20</text><polygon points="231.0,2906.0 1045.0,2906.0 1009.0,2976.0 195.0,2976.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="2941.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">file.write(result + &quot;\n&quot;)</text><text x="195.0" y="2885.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 21</text><polygon points="240.0,3076.0 1000.0,3076.0 1000.0,3166.0 240.0,3166.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="3106.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">Выход из with (стр. 20)</text><text x="620.0" y="3135.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">Автоматическое закрытие файла</text><rect x="355.0" y="3266.0" width="530" height="70" rx="35.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="3301.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">Конец</text><text x="638.0" y="1575.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">исключение</text><text x="1317.5" y="1716.0" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Да</text><text x="638.0" y="1837.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">Нет</text><text x="2220.0" y="1821" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">исключение</text><text x="1838.0" y="1807.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">исключение</text><text x="638.0" y="2015.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">исключение</text><text x="2480.0" y="2169.0" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">совпало</text><text x="1838.0" y="2302.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">другой тип</text><polyline points="620.0,580.0 620.0,535 4015.0,535 4015.0,3571 945.0,3571" fill="none" stroke="#999999" stroke-width="1.7" stroke-dasharray="10 8"/><text x="490.0" y="3571" font-size="26" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Функция calculate</text><polyline points="490.0,3726.0 490.0,3826.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="225.0" y="3656.0" width="530" height="70" rx="35.0" fill="white" stroke="black" stroke-width="1.7"/><text x="490.0" y="3691.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">calculate(…)</text><rect x="120.0" y="3826.0" width="740.0" height="119" rx="59.5" fill="white" stroke="black" stroke-width="1.7"/><text x="490.0" y="3856.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">return (1 - y) * log(x) / abs(x * y + sin(x)) + </text><text x="490.0" y="3885.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">↪ copysign(abs((x + y) / (0.1 * x)) ** (1 / 3), (x</text><text x="490.0" y="3914.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">↪  + y) / (0.1 * x))</text><text x="120.0" y="3805.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 5</text><text x="2050.0" y="4170" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Номера строк соответствуют листингу отчёта. L — парные границы цикла. Пунктир — раскрытие определения или выражения на этом же изображении.</text></svg>