<svg xmlns="http://www.w3.org/2000/svg" width="3045.0" height="3743" viewBox="0 0 3045.0 3743"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="black"/></marker></defs><text x="1522.5" y="35" font-size="30" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Лабораторная работа №3 · Вариант №8 · noob</text><text x="1522.5" y="80" font-size="24" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Блок-схема по листингу из отчёта</text><polyline points="770.0,310.0 770.0,410.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="770.0,480.0 770.0,580.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="770.0,650.0 770.0,750.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="770.0,820.0 770.0,920.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="770.0,990.0 770.0,1090.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="770.0,1160.0 770.0,1260.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="770.0,1330.0 770.0,1430.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="770.0,1500.0 770.0,1600.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="770.0,1698.0 770.0,1798.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="1270.0,1649.0 2815.0,1649.0 2815.0,3288.0 1177.0,3288.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="770.0,1868.0 770.0,1968.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="1270.0,2043.0 1590.0,2043.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="770.0,2118.0 770.0,2218.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="1970.0,2078.0 1970.0,2340 770.0,2340 770.0,2388.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="770.0,2288.0 770.0,2388.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="1270.0,2463.0 1563.0,2463.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="770.0,2538.0 770.0,2638.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="2377.0,2463.0 2745.0,2463.0 2745.0,3105.5 1270.0,3105.5" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="770.0,2708.0 770.0,2808.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="1270.0,2883.0 1590.0,2883.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="770.0,2958.0 770.0,3058.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="1970.0,2918.0 1970.0,3010 770.0,3010 770.0,3058.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="270.0,3105.5 120.0,3105.5 120.0,1649.0 270.0,1649.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="770.0,3323.0 770.0,3423.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="505.0" y="240.0" width="530" height="70" rx="35.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="275.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">Начало</text><polygon points="390.0,410.0 1150.0,410.0 1150.0,480.0 390.0,480.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="445.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">from math import cos, sin</text><text x="390.0" y="389.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 1</text><polygon points="390.0,580.0 1150.0,580.0 1150.0,650.0 390.0,650.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="615.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">a = -4</text><text x="390.0" y="559.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 4</text><polygon points="390.0,750.0 1150.0,750.0 1150.0,820.0 390.0,820.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="785.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">b = 4</text><text x="390.0" y="729.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 5</text><polygon points="390.0,920.0 1150.0,920.0 1150.0,990.0 390.0,990.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="955.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">h = .6</text><text x="390.0" y="899.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 6</text><polygon points="390.0,1090.0 1150.0,1090.0 1150.0,1160.0 390.0,1160.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="1125.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">n = int((b - a) / h + 1e-9) + 1</text><text x="390.0" y="1069.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 7</text><polygon points="390.0,1260.0 1150.0,1260.0 1150.0,1330.0 390.0,1330.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="1295.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">total = 1.0</text><text x="390.0" y="1239.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 8</text><polygon points="381.0,1430.0 1195.0,1430.0 1159.0,1500.0 345.0,1500.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="1465.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">print(&quot;x | y&quot;)</text><text x="345.0" y="1409.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 10</text><polygon points="450.0,1600.0 1090.0,1600.0 1270.0,1649.0 1090.0,1698.0 450.0,1698.0 270.0,1649.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="1634.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">L1</text><text x="770.0" y="1663.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">for i in range(n):</text><text x="270.0" y="1579.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 11</text><polygon points="390.0,1798.0 1150.0,1798.0 1150.0,1868.0 390.0,1868.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="1833.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">x = round(a + i * h, 12)</text><text x="390.0" y="1777.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 12</text><polygon points="770.0,1968.0 1270.0,2043.0 770.0,2118.0 270.0,2043.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="2043.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">if -1 &lt; x &lt; 1:</text><text x="270.0" y="1947.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 13</text><polygon points="1590.0,2008.0 2350.0,2008.0 2350.0,2078.0 1590.0,2078.0" fill="white" stroke="black" stroke-width="1.7"/><text x="1970.0" y="2043.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">y = sin(x)</text><text x="1590.0" y="1987.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 14</text><polygon points="390.0,2218.0 1150.0,2218.0 1150.0,2288.0 390.0,2288.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="2253.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">y = 5 * cos(x)</text><text x="390.0" y="2197.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 16</text><polygon points="770.0,2388.0 1270.0,2463.0 770.0,2538.0 270.0,2463.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="2463.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">if y is None:</text><text x="270.0" y="2367.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 17</text><polygon points="1581.0,2428.0 2395.0,2428.0 2359.0,2498.0 1545.0,2498.0" fill="white" stroke="black" stroke-width="1.7"/><text x="1970.0" y="2463.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">print(str(x) + &quot; | не определено&quot;)</text><text x="1545.0" y="2407.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 18</text><polygon points="381.0,2638.0 1195.0,2638.0 1159.0,2708.0 345.0,2708.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="2673.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">print(str(x) + &quot; | &quot; + str(y))</text><text x="345.0" y="2617.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 20</text><polygon points="770.0,2808.0 1270.0,2883.0 770.0,2958.0 270.0,2883.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="2883.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">if y &gt; 0:</text><text x="270.0" y="2787.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 21</text><polygon points="1590.0,2848.0 2350.0,2848.0 2350.0,2918.0 1590.0,2918.0" fill="white" stroke="black" stroke-width="1.7"/><text x="1970.0" y="2883.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">total = total * y</text><text x="1590.0" y="2827.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 22</text><polygon points="450.0,3058.0 1090.0,3058.0 1270.0,3105.5 1090.0,3153.0 450.0,3153.0 270.0,3105.5" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="3105.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">L1</text><text x="270.0" y="3037.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 11 · конец тела</text><polygon points="381.0,3253.0 1195.0,3253.0 1159.0,3323.0 345.0,3323.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="3288.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">print(&quot;Произведение = &quot; + str(total))</text><text x="345.0" y="3232.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 24</text><rect x="505.0" y="3423.0" width="530" height="70" rx="35.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="3458.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">Конец</text><text x="788.0" y="1725.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">очередной элемент</text><text x="2042.5" y="1630.0" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">перебор завершён</text><text x="1430.0" y="2024.0" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Да</text><text x="788.0" y="2145.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">Нет · else:</text><text x="1416.5" y="2444.0" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Да</text><text x="788.0" y="2565.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">Нет · else:</text><text x="1430.0" y="2864.0" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Да</text><text x="788.0" y="2985.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">Нет</text><text x="195.0" y="3086.5" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">повтор</text><text x="1522.5" y="3718" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Номера строк соответствуют листингу отчёта. L — парные границы цикла.</text></svg>