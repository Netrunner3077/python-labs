rl(#arrow)"/><polyline points="1970.0,3418.0 1970.0,3510 770.0,3510 770.0,3558.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="270.0,3605.5 120.0,3605.5 120.0,1649.0 270.0,1649.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="770.0,3823.0 770.0,3923.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="505.0" y="240.0" width="530" height="70" rx="35.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="275.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">Начало</text><polygon points="390.0,410.0 1150.0,410.0 1150.0,480.0 390.0,480.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="445.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">from math import exp</text><text x="390.0" y="389.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 1</text><polygon points="390.0,580.0 1150.0,580.0 1150.0,650.0 390.0,650.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="615.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">a = -3</text><text x="390.0" y="559.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 4</text><polygon points="390.0,750.0 1150.0,750.0 1150.0,820.0 390.0,820.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="785.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">b = 3</text><text x="390.0" y="729.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 5</text><polygon points="390.0,920.0 1150.0,920.0 1150.0,990.0 390.0,990.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="955.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">h = .4</text><text x="390.0" y="899.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 6</text><polygon points="390.0,1090.0 1150.0,1090.0 1150.0,1160.0 390.0,1160.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="1125.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">n = int((b - a) / h + 1e-9) + 1</text><text x="390.0" y="1069.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 7</text><polygon points="390.0,1260.0 1150.0,1260.0 1150.0,1330.0 390.0,1330.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="1295.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">total = 1.0</text><text x="390.0" y="1239.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 8</text><polygon points="381.0,1430.0 1195.0,1430.0 1159.0,1500.0 345.0,1500.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="1465.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">print(&quot;x | y&quot;)</text><text x="345.0" y="1409.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 10</text><polygon points="450.0,1600.0 1090.0,1600.0 1270.0,1649.0 1090.0,1698.0 450.0,1698.0 270.0,1649.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="1634.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">L1</text><text x="770.0" y="1663.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">for i in range(n):</text><text x="270.0" y="1579.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 11</text><polygon points="390.0,1798.0 1150.0,1798.0 1150.0,1868.0 390.0,1868.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="1833.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">x = round(a + i * h, 12)</text><text x="390.0" y="1777.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 12</text><polygon points="770.0,1968.0 1270.0,2043.0 770.0,2118.0 270.0,2043.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="2043.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">if x &gt; 2:</text><text x="270.0" y="1947.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 13</text><polygon points="1590.0,2008.0 2350.0,2008.0 2350.0,2078.0 1590.0,2078.0" fill="white" stroke="black" stroke-width="1.7"/><text x="1970.0" y="2043.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">y = exp(x)</text><text x="1590.0" y="1987.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 14</text><polygon points="770.0,2218.0 1270.0,2293.0 770.0,2368.0 270.0,2293.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="2293.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">elif -2 &lt; x &lt; 2:</text><text x="270.0" y="2197.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 15</text><polygon points="1590.0,2258.0 2350.0,2258.0 2350.0,2328.0 1590.0,2328.0" fill="white" stroke="black" stroke-width="1.7"/><text x="1970.0" y="2293.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">y = x + 4</text><text x="1590.0" y="2237.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 16</text><polygon points="770.0,2468.0 1270.0,2543.0 770.0,2618.0 270.0,2543.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="2543.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">elif x &lt; -2:</text><text x="270.0" y="2447.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 17</text><polygon points="1590.0,2508.0 2350.0,2508.0 2350.0,2578.0 1590.0,2578.0" fill="white" stroke="black" stroke-width="1.7"/><text x="1970.0" y="2543.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">y = 0</text><text x="1590.0" y="2487.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 18</text><polygon points="390.0,2718.0 1150.0,2718.0 1150.0,2788.0 390.0,2788.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="2753.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">y = None</text><text x="390.0" y="2697.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 20</text><polygon points="770.0,2888.0 1270.0,2963.0 770.0,3038.0 270.0,2963.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="2963.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">if y is None:</text><text x="270.0" y="2867.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 21</text><polygon points="1581.0,2928.0 2395.0,2928.0 2359.0,2998.0 1545.0,2998.0" fill="white" stroke="black" stroke-width="1.7"/><text x="1970.0" y="2963.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">print(str(x) + &quot; | не определено&quot;)</text><text x="1545.0" y="2907.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 22</text><polygon points="381.0,3138.0 1195.0,3138.0 1159.0,3208.0 345.0,3208.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="3173.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">print(str(x) + &quot; | &quot; + str(y))</text><text x="345.0" y="3117.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 24</text><polygon points="770.0,3308.0 1270.0,3383.0 770.0,3458.0 270.0,3383.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="3383.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">if y &lt; 0:</text><text x="270.0" y="3287.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 25</text><polygon points="1590.0,3348.0 2350.0,3348.0 2350.0,3418.0 1590.0,3418.0" fill="white" stroke="black" stroke-width="1.7"/><text x="1970.0" y="3383.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">total = total * y</text><text x="1590.0" y="3327.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 26</text><polygon points="450.0,3558.0 1090.0,3558.0 1270.0,3605.5 1090.0,3653.0 450.0,3653.0 270.0,3605.5" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="3605.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">L1</text><text x="270.0" y="3537.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 11 · конец тела</text><polygon points="381.0,3753.0 1195.0,3753.0 1159.0,3823.0 345.0,3823.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="3788.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">print(&quot;Произведение = &quot; + str(total))</text><text x="345.0" y="3732.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 28</text><rect x="505.0" y="3923.0" width="530" height="70" rx="35.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="3958.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">Конец</text><text x="788.0" y="1725.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">очередной элемент</text><text x="2077.5" y="1630.0" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">перебор завершён</text><text x="1430.0" y="2024.0" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Да</text><text x="788.0" y="2145.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">Нет</text><text x="1430.0" y="2274.0" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Да</text><text x="788.0" y="2395.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">Нет</text><text x="1430.0" y="2524.0" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Да</text><text x="788.0" y="2645.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">Нет · else:</text><text x="1416.5" y="2944.0" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Да</text><text x="788.0" y="3065.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">Нет · else:</text><text x="1430.0" y="3364.0" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Да</text><text x="788.0" y="3485.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">Нет</text><text x="195.0" y="3586.5" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">повтор</text><text x="1557.5" y="4218" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Номера строк соответствуют листингу отчёта. L — парные границы цикла.</text></svg>