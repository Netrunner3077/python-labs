ll="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="275.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">Начало</text><polygon points="390.0,410.0 1150.0,410.0 1150.0,480.0 390.0,480.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="445.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">a = -2</text><text x="390.0" y="389.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 1</text><polygon points="390.0,580.0 1150.0,580.0 1150.0,650.0 390.0,650.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="615.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">b = 0</text><text x="390.0" y="559.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 2</text><polygon points="390.0,750.0 1150.0,750.0 1150.0,820.0 390.0,820.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="785.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">h = .1</text><text x="390.0" y="729.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 3</text><polygon points="390.0,920.0 1150.0,920.0 1150.0,990.0 390.0,990.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="955.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">n = int((b - a) / h + 1e-9) + 1</text><text x="390.0" y="899.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 4</text><polygon points="390.0,1090.0 1150.0,1090.0 1150.0,1160.0 390.0,1160.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="1125.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">total = 1.0</text><text x="390.0" y="1069.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 5</text><polygon points="381.0,1260.0 1195.0,1260.0 1159.0,1350.0 345.0,1350.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="1290.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">with open(&quot;result.txt&quot;, &quot;w&quot;, encoding=&quot;utf-8&quot;) </text><text x="770.0" y="1319.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">↪ as file:</text><text x="345.0" y="1239.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 7</text><polygon points="381.0,1450.0 1195.0,1450.0 1159.0,1520.0 345.0,1520.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="1485.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">print(&quot;x | y&quot;)</text><text x="345.0" y="1429.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 8</text><polygon points="381.0,1620.0 1195.0,1620.0 1159.0,1690.0 345.0,1690.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="1655.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">file.write(&quot;x | y\n&quot;)</text><text x="345.0" y="1599.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 9</text><polygon points="450.0,1790.0 1090.0,1790.0 1270.0,1839.0 1090.0,1888.0 450.0,1888.0 270.0,1839.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="1824.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">L1</text><text x="770.0" y="1853.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">for i in range(n):</text><text x="270.0" y="1769.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 10</text><polygon points="390.0,1988.0 1150.0,1988.0 1150.0,2058.0 390.0,2058.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="2023.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">x = round(a + i * h, 12)</text><text x="390.0" y="1967.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 11</text><polygon points="390.0,2158.0 1150.0,2158.0 1150.0,2228.0 390.0,2228.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="2193.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">y = x ** 4 + x ** 3 - 10 * x ** 2 - 34 * x - 25</text><text x="390.0" y="2137.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 12</text><polygon points="770.0,2328.0 1270.0,2403.0 770.0,2478.0 270.0,2403.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="2403.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">if y is None:</text><text x="270.0" y="2307.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 13</text><polygon points="1590.0,2368.0 2350.0,2368.0 2350.0,2438.0 1590.0,2438.0" fill="white" stroke="black" stroke-width="1.7"/><text x="1970.0" y="2403.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">row = f&quot;{x:.8g} | не определено&quot;</text><text x="1590.0" y="2347.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 14</text><polygon points="390.0,2578.0 1150.0,2578.0 1150.0,2648.0 390.0,2648.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="2613.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">row = f&quot;{x:.8g} | {y:.10g}&quot;</text><text x="390.0" y="2557.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 16</text><polygon points="770.0,2748.0 1270.0,2823.0 770.0,2898.0 270.0,2823.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="2823.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">if y &lt; 0:</text><text x="270.0" y="2727.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 17</text><polygon points="1590.0,2788.0 2350.0,2788.0 2350.0,2858.0 1590.0,2858.0" fill="white" stroke="black" stroke-width="1.7"/><text x="1970.0" y="2823.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">total = total * y</text><text x="1590.0" y="2767.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 18</text><polygon points="381.0,2998.0 1195.0,2998.0 1159.0,3068.0 345.0,3068.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="3033.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">print(row)</text><text x="345.0" y="2977.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 19</text><polygon points="381.0,3168.0 1195.0,3168.0 1159.0,3238.0 345.0,3238.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="3203.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">file.write(row + &quot;\n&quot;)</text><text x="345.0" y="3147.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 20</text><polygon points="450.0,3338.0 1090.0,3338.0 1270.0,3385.5 1090.0,3433.0 450.0,3433.0 270.0,3385.5" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="3385.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">L1</text><text x="270.0" y="3317.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 10 · конец тела</text><polygon points="390.0,3533.0 1150.0,3533.0 1150.0,3603.0 390.0,3603.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="3568.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">summary = f&quot;Произведение = {total}&quot;</text><text x="390.0" y="3512.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 21</text><polygon points="381.0,3703.0 1195.0,3703.0 1159.0,3773.0 345.0,3773.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="3738.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">print(summary)</text><text x="345.0" y="3682.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 22</text><polygon points="381.0,3873.0 1195.0,3873.0 1159.0,3943.0 345.0,3943.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="3908.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">file.write(summary + &quot;\n&quot;)</text><text x="345.0" y="3852.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 23</text><polygon points="390.0,4043.0 1150.0,4043.0 1150.0,4133.0 390.0,4133.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="4073.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">Выход из with (стр. 7)</text><text x="770.0" y="4102.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">Автоматическое закрытие файла</text><rect x="505.0" y="4233.0" width="530" height="70" rx="35.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="4268.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">Конец</text><text x="788.0" y="1915.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">очередной элемент</text><text x="2020.0" y="1820.0" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">перебор завершён</text><text x="1430.0" y="2384.0" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Да</text><text x="788.0" y="2505.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">Нет · else:</text><text x="1430.0" y="2804.0" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Да</text><text x="788.0" y="2925.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">Нет</text><text x="195.0" y="3366.5" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">повтор</text><text x="1500.0" y="4528" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Номера строк соответствуют листингу отчёта. L — парные границы цикла.</text></svg>