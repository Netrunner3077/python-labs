nts="770.0,3738.0 770.0,3838.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="770.0,3908.0 770.0,4008.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="270.0,4055.5 120.0,4055.5 120.0,2009.0 270.0,2009.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="770.0,4273.0 770.0,4373.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="770.0,4443.0 770.0,4543.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="770.0,4613.0 770.0,4713.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="770.0,4803.0 770.0,4903.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="505.0" y="240.0" width="530" height="70" rx="35.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="275.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">Начало</text><polygon points="390.0,410.0 1150.0,410.0 1150.0,480.0 390.0,480.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="445.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">from math import exp</text><text x="390.0" y="389.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 1</text><polygon points="390.0,580.0 1150.0,580.0 1150.0,650.0 390.0,650.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="615.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">a = -3</text><text x="390.0" y="559.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 4</text><polygon points="390.0,750.0 1150.0,750.0 1150.0,820.0 390.0,820.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="785.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">b = 3</text><text x="390.0" y="729.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 5</text><polygon points="390.0,920.0 1150.0,920.0 1150.0,990.0 390.0,990.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="955.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">h = .3</text><text x="390.0" y="899.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 6</text><polygon points="390.0,1090.0 1150.0,1090.0 1150.0,1160.0 390.0,1160.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="1125.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">n = int((b - a) / h + 1e-9) + 1</text><text x="390.0" y="1069.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 7</text><polygon points="390.0,1260.0 1150.0,1260.0 1150.0,1330.0 390.0,1330.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="1295.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">total = 1.0</text><text x="390.0" y="1239.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 8</text><polygon points="381.0,1430.0 1195.0,1430.0 1159.0,1520.0 345.0,1520.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="1460.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">with open(&quot;result.txt&quot;, &quot;w&quot;, encoding=&quot;utf-8&quot;) </text><text x="770.0" y="1489.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">↪ as file:</text><text x="345.0" y="1409.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 10</text><polygon points="381.0,1620.0 1195.0,1620.0 1159.0,1690.0 345.0,1690.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="1655.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">print(&quot;x | y&quot;)</text><text x="345.0" y="1599.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 11</text><polygon points="381.0,1790.0 1195.0,1790.0 1159.0,1860.0 345.0,1860.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="1825.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">file.write(&quot;x | y\n&quot;)</text><text x="345.0" y="1769.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 12</text><polygon points="450.0,1960.0 1090.0,1960.0 1270.0,2009.0 1090.0,2058.0 450.0,2058.0 270.0,2009.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="1994.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">L1</text><text x="770.0" y="2023.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">for i in range(n):</text><text x="270.0" y="1939.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 13</text><polygon points="390.0,2158.0 1150.0,2158.0 1150.0,2228.0 390.0,2228.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="2193.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">x = round(a + i * h, 12)</text><text x="390.0" y="2137.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 14</text><polygon points="770.0,2328.0 1270.0,2403.0 770.0,2478.0 270.0,2403.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="2403.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">if x &gt; 1:</text><text x="270.0" y="2307.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 15</text><polygon points="1590.0,2368.0 2350.0,2368.0 2350.0,2438.0 1590.0,2438.0" fill="white" stroke="black" stroke-width="1.7"/><text x="1970.0" y="2403.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">y = exp(x)</text><text x="1590.0" y="2347.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 16</text><polygon points="770.0,2578.0 1270.0,2653.0 770.0,2728.0 270.0,2653.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="2653.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">elif x &lt; 0:</text><text x="270.0" y="2557.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 17</text><polygon points="1590.0,2618.0 2350.0,2618.0 2350.0,2688.0 1590.0,2688.0" fill="white" stroke="black" stroke-width="1.7"/><text x="1970.0" y="2653.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">y = 2 * x - 1</text><text x="1590.0" y="2597.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 18</text><polygon points="390.0,2828.0 1150.0,2828.0 1150.0,2898.0 390.0,2898.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="2863.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">y = -1</text><text x="390.0" y="2807.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 20</text><polygon points="770.0,2998.0 1270.0,3073.0 770.0,3148.0 270.0,3073.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="3073.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">if y is None:</text><text x="270.0" y="2977.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 21</text><polygon points="1590.0,3038.0 2350.0,3038.0 2350.0,3108.0 1590.0,3108.0" fill="white" stroke="black" stroke-width="1.7"/><text x="1970.0" y="3073.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">row = f&quot;{x:.8g} | не определено&quot;</text><text x="1590.0" y="3017.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 22</text><polygon points="390.0,3248.0 1150.0,3248.0 1150.0,3318.0 390.0,3318.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="3283.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">row = f&quot;{x:.8g} | {y:.10g}&quot;</text><text x="390.0" y="3227.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 24</text><polygon points="770.0,3418.0 1270.0,3493.0 770.0,3568.0 270.0,3493.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="3493.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">if y &gt; 0:</text><text x="270.0" y="3397.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 25</text><polygon points="1590.0,3458.0 2350.0,3458.0 2350.0,3528.0 1590.0,3528.0" fill="white" stroke="black" stroke-width="1.7"/><text x="1970.0" y="3493.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">total = total * y</text><text x="1590.0" y="3437.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 26</text><polygon points="381.0,3668.0 1195.0,3668.0 1159.0,3738.0 345.0,3738.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="3703.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">print(row)</text><text x="345.0" y="3647.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 27</text><polygon points="381.0,3838.0 1195.0,3838.0 1159.0,3908.0 345.0,3908.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="3873.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">file.write(row + &quot;\n&quot;)</text><text x="345.0" y="3817.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 28</text><polygon points="450.0,4008.0 1090.0,4008.0 1270.0,4055.5 1090.0,4103.0 450.0,4103.0 270.0,4055.5" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="4055.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">L1</text><text x="270.0" y="3987.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 13 · конец тела</text><polygon points="390.0,4203.0 1150.0,4203.0 1150.0,4273.0 390.0,4273.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="4238.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">summary = f&quot;Произведение = {total}&quot;</text><text x="390.0" y="4182.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 29</text><polygon points="381.0,4373.0 1195.0,4373.0 1159.0,4443.0 345.0,4443.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="4408.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">print(summary)</text><text x="345.0" y="4352.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 30</text><polygon points="381.0,4543.0 1195.0,4543.0 1159.0,4613.0 345.0,4613.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="4578.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">file.write(summary + &quot;\n&quot;)</text><text x="345.0" y="4522.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 31</text><polygon points="390.0,4713.0 1150.0,4713.0 1150.0,4803.0 390.0,4803.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="4743.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">Выход из with (стр. 10)</text><text x="770.0" y="4772.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">Автоматическое закрытие файла</text><rect x="505.0" y="4903.0" width="530" height="70" rx="35.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="4938.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">Конец</text><text x="788.0" y="2085.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">очередной элемент</text><text x="2055.0" y="1990.0" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">перебор завершён</text><text x="1430.0" y="2384.0" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Да</text><text x="788.0" y="2505.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">Нет</text><text x="1430.0" y="2634.0" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Да</text><text x="788.0" y="2755.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">Нет · else:</text><text x="1430.0" y="3054.0" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Да</text><text x="788.0" y="3175.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">Нет · else:</text><text x="1430.0" y="3474.0" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Да</text><text x="788.0" y="3595.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">Нет</text><text x="195.0" y="4036.5" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">повтор</text><text x="1535.0" y="5198" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Номера строк соответствуют листингу отчёта. L — парные границы цикла.</text></svg>