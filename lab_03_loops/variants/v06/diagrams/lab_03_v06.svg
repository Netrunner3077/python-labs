770.0" y="445.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">from math import exp</text><text x="390.0" y="389.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 1</text><polygon points="390.0,580.0 1150.0,580.0 1150.0,650.0 390.0,650.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="615.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">a = -30</text><text x="390.0" y="559.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 4</text><polygon points="390.0,750.0 1150.0,750.0 1150.0,820.0 390.0,820.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="785.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">b = 30</text><text x="390.0" y="729.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 5</text><polygon points="390.0,920.0 1150.0,920.0 1150.0,990.0 390.0,990.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="955.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">h = 3</text><text x="390.0" y="899.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 6</text><polygon points="390.0,1090.0 1150.0,1090.0 1150.0,1160.0 390.0,1160.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="1125.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">n = (b - a) // h + 1</text><text x="390.0" y="1069.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 7</text><polygon points="390.0,1260.0 1150.0,1260.0 1150.0,1330.0 390.0,1330.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="1295.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">p = 1.0</text><text x="390.0" y="1239.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 8</text><polygon points="381.0,1430.0 1195.0,1430.0 1159.0,1500.0 345.0,1500.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="1465.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">print(&quot;x | y&quot;)</text><text x="345.0" y="1409.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 9</text><polygon points="450.0,1600.0 1090.0,1600.0 1270.0,1649.0 1090.0,1698.0 450.0,1698.0 270.0,1649.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="1634.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">L1</text><text x="770.0" y="1663.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">for i in range(n):</text><text x="270.0" y="1579.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 11</text><polygon points="390.0,1798.0 1150.0,1798.0 1150.0,1868.0 390.0,1868.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="1833.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">x = (a + h * i) / 10</text><text x="390.0" y="1777.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 12</text><polygon points="770.0,1968.0 1270.0,2043.0 770.0,2118.0 270.0,2043.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="2043.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">if x &gt; 1:</text><text x="270.0" y="1947.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 14</text><polygon points="1590.0,2008.0 2350.0,2008.0 2350.0,2078.0 1590.0,2078.0" fill="white" stroke="black" stroke-width="1.7"/><text x="1970.0" y="2043.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">y = exp(x)</text><text x="1590.0" y="1987.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 15</text><polygon points="770.0,2218.0 1270.0,2293.0 770.0,2368.0 270.0,2293.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="2293.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">elif x &lt; 0:</text><text x="270.0" y="2197.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 16</text><polygon points="1590.0,2258.0 2350.0,2258.0 2350.0,2328.0 1590.0,2328.0" fill="white" stroke="black" stroke-width="1.7"/><text x="1970.0" y="2293.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">y = 2 * x - 1</text><text x="1590.0" y="2237.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 17</text><polygon points="390.0,2468.0 1150.0,2468.0 1150.0,2538.0 390.0,2538.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="2503.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">y = -1.0</text><text x="390.0" y="2447.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 19</text><polygon points="381.0,2638.0 1195.0,2638.0 1159.0,2708.0 345.0,2708.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="2673.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">print(str(x) + &quot; | &quot; + str(y))</text><text x="345.0" y="2617.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 21</text><polygon points="770.0,2808.0 1270.0,2883.0 770.0,2958.0 270.0,2883.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="2883.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">if y &gt; 0:</text><text x="270.0" y="2787.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 22</text><polygon points="1590.0,2848.0 2350.0,2848.0 2350.0,2918.0 1590.0,2918.0" fill="white" stroke="black" stroke-width="1.7"/><text x="1970.0" y="2883.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">p = p * y</text><text x="1590.0" y="2827.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 23</text><polygon points="450.0,3058.0 1090.0,3058.0 1270.0,3105.5 1090.0,3153.0 450.0,3153.0 270.0,3105.5" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="3105.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">L1</text><text x="270.0" y="3037.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 11 · конец тела</text><polygon points="381.0,3253.0 1195.0,3253.0 1159.0,3343.0 345.0,3343.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="3283.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">print(&quot;Произведение положительных y = &quot; + </text><text x="770.0" y="3312.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">↪ str(p))</text><text x="345.0" y="3232.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 25</text><rect x="505.0" y="3443.0" width="530" height="70" rx="35.0" fill="white" stroke="black" stroke-width="1.7"/><text x="770.0" y="3478.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">Конец</text><text x="788.0" y="1725.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">очередной элемент</text><text x="2020.0" y="1630.0" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">перебор завершён</text><text x="1430.0" y="2024.0" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Да</text><text x="788.0" y="2145.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">Нет</text><text x="1430.0" y="2274.0" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Да</text><text x="788.0" y="2395.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">Нет · else:</text><text x="1430.0" y="2864.0" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Да</text><text x="788.0" y="2985.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">Нет</text><text x="195.0" y="3086.5" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">повтор</text><text x="1500.0" y="3738" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Номера строк соответствуют листингу отчёта. L — парные границы цикла.</text></svg>