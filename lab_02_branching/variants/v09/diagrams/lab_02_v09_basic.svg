<svg xmlns="http://www.w3.org/2000/svg" width="2780.0" height="3560" viewBox="0 0 2780.0 3560"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="black"/></marker></defs><text x="1390.0" y="35" font-size="30" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Лабораторная работа №2 · Вариант №9 · basic</text><text x="1390.0" y="80" font-size="24" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Блок-схема по листингу из отчёта</text><polyline points="620.0,310.0 620.0,410.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,480.0 620.0,580.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,650.0 620.0,750.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,820.0 620.0,920.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,990.0 620.0,1090.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,1160.0 620.0,1260.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="1120.0,1335.0 1440.0,1335.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,1410.0 620.0,1510.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="2200.0,1335.0 2550.0,1335.0 2550.0,1965.0 1000.0,1965.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="1120.0,1585.0 1440.0,1585.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,1660.0 620.0,1760.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="1820.0,1620.0 1820.0,1882 620.0,1882 620.0,1930.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,1830.0 620.0,1930.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,2000.0 620.0,2100.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="1120.0,2175.0 1440.0,2175.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,2250.0 620.0,2350.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="1820.0,2210.0 1820.0,2472 620.0,2472 620.0,2520.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,2420.0 620.0,2520.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,2590.0 620.0,2690.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,2780.0 620.0,2880.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,2950.0 620.0,3050.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,3140.0 620.0,3240.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="355.0" y="240.0" width="530" height="70" rx="35.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="275.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">Начало</text><polygon points="240.0,410.0 1000.0,410.0 1000.0,480.0 240.0,480.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="445.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">from math import exp, log, sqrt</text><text x="240.0" y="389.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 1</text><polygon points="231.0,580.0 1045.0,580.0 1009.0,650.0 195.0,650.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="615.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">x = float(input(&quot;Введите x: &quot;))</text><text x="195.0" y="559.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 4</text><polygon points="231.0,750.0 1045.0,750.0 1009.0,820.0 195.0,820.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="785.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">y = float(input(&quot;Введите y: &quot;))</text><text x="195.0" y="729.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 5</text><polygon points="231.0,920.0 1045.0,920.0 1009.0,990.0 195.0,990.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="955.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">a = float(input(&quot;Введите a: &quot;))</text><text x="195.0" y="899.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 6</text><polygon points="231.0,1090.0 1045.0,1090.0 1009.0,1160.0 195.0,1160.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="1125.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">b = float(input(&quot;Введите b: &quot;))</text><text x="195.0" y="1069.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 7</text><polygon points="620.0,1260.0 1120.0,1335.0 620.0,1410.0 120.0,1335.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="1335.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">if x * y &gt; 0:</text><text x="120.0" y="1239.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 9</text><polygon points="1440.0,1300.0 2200.0,1300.0 2200.0,1370.0 1440.0,1370.0" fill="white" stroke="black" stroke-width="1.7"/><text x="1820.0" y="1335.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">z = 1 - exp(x * y + a * b)</text><text x="1440.0" y="1279.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 10</text><polygon points="620.0,1510.0 1120.0,1585.0 620.0,1660.0 120.0,1585.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="1585.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">elif x * y == 0:</text><text x="120.0" y="1489.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 11</text><polygon points="1440.0,1550.0 2200.0,1550.0 2200.0,1620.0 1440.0,1620.0" fill="white" stroke="black" stroke-width="1.7"/><text x="1820.0" y="1585.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">z = b - min(a * x, y)</text><text x="1440.0" y="1529.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 12</text><polygon points="240.0,1760.0 1000.0,1760.0 1000.0,1830.0 240.0,1830.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="1795.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">z = max(x ** 3, exp(y), sqrt(abs(log(y ** 2))))</text><text x="240.0" y="1739.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 14</text><polygon points="240.0,1930.0 1000.0,1930.0 1000.0,2000.0 240.0,2000.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="1965.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">result = f&quot;x = {x}\ny = {y}\na = {a}\nb = {b}&quot;</text><text x="240.0" y="1909.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 16</text><polygon points="620.0,2100.0 1120.0,2175.0 620.0,2250.0 120.0,2175.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="2175.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">if z is None:</text><text x="120.0" y="2079.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 17</text><polygon points="1440.0,2140.0 2200.0,2140.0 2200.0,2210.0 1440.0,2210.0" fill="white" stroke="black" stroke-width="1.7"/><text x="1820.0" y="2175.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">result += &quot;\nФормула для этих данных не задана.&quot;</text><text x="1440.0" y="2119.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 18</text><polygon points="240.0,2350.0 1000.0,2350.0 1000.0,2420.0 240.0,2420.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="2385.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">result += f&quot;\nРезультат = {z:.10g}&quot;</text><text x="240.0" y="2329.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 20</text><polygon points="231.0,2520.0 1045.0,2520.0 1009.0,2590.0 195.0,2590.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="2555.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">print(result)</text><text x="195.0" y="2499.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 21</text><polygon points="231.0,2690.0 1045.0,2690.0 1009.0,2780.0 195.0,2780.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="2720.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">with open(&quot;result.txt&quot;, &quot;w&quot;, encoding=&quot;utf-8&quot;) </text><text x="620.0" y="2749.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">↪ as file:</text><text x="195.0" y="2669.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 22</text><polygon points="231.0,2880.0 1045.0,2880.0 1009.0,2950.0 195.0,2950.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="2915.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">file.write(result + &quot;\n&quot;)</text><text x="195.0" y="2859.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 23</text><polygon points="240.0,3050.0 1000.0,3050.0 1000.0,3140.0 240.0,3140.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="3080.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">Выход из with (стр. 22)</text><text x="620.0" y="3109.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">Автоматическое закрытие файла</text><rect x="355.0" y="3240.0" width="530" height="70" rx="35.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="3275.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">Конец</text><text x="1280.0" y="1316.0" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Да</text><text x="638.0" y="1437.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">Нет</text><text x="1280.0" y="1566.0" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Да</text><text x="638.0" y="1687.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">Нет · else:</text><text x="1280.0" y="2156.0" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Да</text><text x="638.0" y="2277.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">Нет · else:</text><text x="1390.0" y="3535" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Номера строк соответствуют листингу отчёта. L — парные границы цикла.</text></svg>