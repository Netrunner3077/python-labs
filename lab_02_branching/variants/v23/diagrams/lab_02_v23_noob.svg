s="2200.0,1585.0 2595.0,1585.0 2595.0,2239.5 1027.0,2239.5" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="1120.0,1835.0 1440.0,1835.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,1910.0 620.0,2010.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="1820.0,1870.0 1820.0,2132 620.0,2132 620.0,2180.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,2080.0 620.0,2180.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,2299.0 620.0,2399.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="1120.0,2474.0 1413.0,2474.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,2549.0 620.0,2649.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="1820.0,2509.0 1820.0,2771 620.0,2771 620.0,2819.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,2719.0 620.0,2819.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="355.0" y="240.0" width="530" height="70" rx="35.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="275.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">Начало</text><polygon points="240.0,410.0 1000.0,410.0 1000.0,480.0 240.0,480.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="445.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">from math import log10</text><text x="240.0" y="389.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 1</text><polygon points="240.0,580.0 1000.0,580.0 1000.0,650.0 240.0,650.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="615.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">x = 2.0</text><text x="240.0" y="559.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 4</text><polygon points="240.0,750.0 1000.0,750.0 1000.0,820.0 240.0,820.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="785.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">y = 2.0</text><text x="240.0" y="729.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 5</text><polygon points="240.0,920.0 1000.0,920.0 1000.0,990.0 240.0,990.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="955.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">c = 1.0</text><text x="240.0" y="899.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 6</text><polygon points="240.0,1090.0 1000.0,1090.0 1000.0,1160.0 240.0,1160.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="1125.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">d = 2.0</text><text x="240.0" y="1069.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 7</text><polygon points="620.0,1260.0 1120.0,1335.0 620.0,1410.0 120.0,1335.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="1335.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">if x * y &gt; 3:</text><text x="120.0" y="1239.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 9</text><polygon points="1440.0,1300.0 2200.0,1300.0 2200.0,1370.0 1440.0,1370.0" fill="white" stroke="black" stroke-width="1.7"/><text x="1820.0" y="1335.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">z = x ** 3 + log10(x * y) ** (c * d)</text><text x="1440.0" y="1279.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 10</text><polygon points="620.0,1510.0 1120.0,1585.0 620.0,1660.0 120.0,1585.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="1585.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">elif 2 &lt; x * y &lt; 3:</text><text x="120.0" y="1489.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 11</text><polygon points="1440.0,1550.0 2200.0,1550.0 2200.0,1620.0 1440.0,1620.0" fill="white" stroke="black" stroke-width="1.7"/><text x="1820.0" y="1585.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">z = 3 * min(x, y, max(c * x, d * y))</text><text x="1440.0" y="1529.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 12</text><polygon points="620.0,1760.0 1120.0,1835.0 620.0,1910.0 120.0,1835.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="1835.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">elif x * y &lt; 2:</text><text x="120.0" y="1739.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 13</text><polygon points="1440.0,1800.0 2200.0,1800.0 2200.0,1870.0 1440.0,1870.0" fill="white" stroke="black" stroke-width="1.7"/><text x="1820.0" y="1835.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">z = 2 ** (c * d) - x</text><text x="1440.0" y="1779.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 14</text><polygon points="240.0,2010.0 1000.0,2010.0 1000.0,2080.0 240.0,2080.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="2045.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">z = None</text><text x="240.0" y="1989.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 16</text><polygon points="231.0,2180.0 1045.0,2180.0 1009.0,2299.0 195.0,2299.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="2210.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">print(&quot;x = &quot; + str(x) + &quot;, &quot; + &quot;y = &quot; + str(y) +</text><text x="620.0" y="2239.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">↪  &quot;, &quot; + &quot;c = &quot; + str(c) + &quot;, &quot; + &quot;d = &quot; + </text><text x="620.0" y="2268.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">↪ str(d))</text><text x="195.0" y="2159.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 18</text><polygon points="620.0,2399.0 1120.0,2474.0 620.0,2549.0 120.0,2474.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="2474.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">if z is None:</text><text x="120.0" y="2378.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 19</text><polygon points="1431.0,2439.0 2245.0,2439.0 2209.0,2509.0 1395.0,2509.0" fill="white" stroke="black" stroke-width="1.7"/><text x="1820.0" y="2474.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">print(&quot;Формула для этих данных не задана.&quot;)</text><text x="1395.0" y="2418.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 20</text><polygon points="231.0,2649.0 1045.0,2649.0 1009.0,2719.0 195.0,2719.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="2684.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">print(&quot;Результат = &quot; + str(z))</text><text x="195.0" y="2628.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 22</text><rect x="355.0" y="2819.0" width="530" height="70" rx="35.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="2854.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">Конец</text><text x="1280.0" y="1316.0" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Да</text><text x="638.0" y="1437.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">Нет</text><text x="1280.0" y="1566.0" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Да</text><text x="638.0" y="1687.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">Нет</text><text x="1280.0" y="1816.0" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Да</text><text x="638.0" y="1937.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">Нет · else:</text><text x="1266.5" y="2455.0" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Да</text><text x="638.0" y="2576.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">Нет · else:</text><text x="1412.5" y="3114" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Номера строк соответствуют листингу отчёта. L — парные границы цикла.</text></svg>