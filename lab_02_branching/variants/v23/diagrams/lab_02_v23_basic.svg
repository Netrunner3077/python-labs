ts="2200.0,1585.0 2550.0,1585.0 2550.0,2215.0 1000.0,2215.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="1120.0,1835.0 1440.0,1835.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,1910.0 620.0,2010.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="1820.0,1870.0 1820.0,2132 620.0,2132 620.0,2180.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,2080.0 620.0,2180.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,2250.0 620.0,2350.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="1120.0,2425.0 1440.0,2425.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,2500.0 620.0,2600.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="1820.0,2460.0 1820.0,2722 620.0,2722 620.0,2770.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,2670.0 620.0,2770.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,2840.0 620.0,2940.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,3030.0 620.0,3130.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,3200.0 620.0,3300.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,3390.0 620.0,3490.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="355.0" y="240.0" width="530" height="70" rx="35.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="275.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">Начало</text><polygon points="240.0,410.0 1000.0,410.0 1000.0,480.0 240.0,480.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="445.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">from math import log10</text><text x="240.0" y="389.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 1</text><polygon points="231.0,580.0 1045.0,580.0 1009.0,650.0 195.0,650.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="615.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">x = float(input(&quot;Введите x: &quot;))</text><text x="195.0" y="559.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 4</text><polygon points="231.0,750.0 1045.0,750.0 1009.0,820.0 195.0,820.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="785.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">y = float(input(&quot;Введите y: &quot;))</text><text x="195.0" y="729.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 5</text><polygon points="231.0,920.0 1045.0,920.0 1009.0,990.0 195.0,990.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="955.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">c = float(input(&quot;Введите c: &quot;))</text><text x="195.0" y="899.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 6</text><polygon points="231.0,1090.0 1045.0,1090.0 1009.0,1160.0 195.0,1160.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="1125.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">d = float(input(&quot;Введите d: &quot;))</text><text x="195.0" y="1069.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 7</text><polygon points="620.0,1260.0 1120.0,1335.0 620.0,1410.0 120.0,1335.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="1335.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">if x * y &gt; 3:</text><text x="120.0" y="1239.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 9</text><polygon points="1440.0,1300.0 2200.0,1300.0 2200.0,1370.0 1440.0,1370.0" fill="white" stroke="black" stroke-width="1.7"/><text x="1820.0" y="1335.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">z = x ** 3 + log10(x * y) ** (c * d)</text><text x="1440.0" y="1279.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 10</text><polygon points="620.0,1510.0 1120.0,1585.0 620.0,1660.0 120.0,1585.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="1585.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">elif 2 &lt; x * y &lt; 3:</text><text x="120.0" y="1489.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 11</text><polygon points="1440.0,1550.0 2200.0,1550.0 2200.0,1620.0 1440.0,1620.0" fill="white" stroke="black" stroke-width="1.7"/><text x="1820.0" y="1585.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">z = 3 * min(x, y, max(c * x, d * y))</text><text x="1440.0" y="1529.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 12</text><polygon points="620.0,1760.0 1120.0,1835.0 620.0,1910.0 120.0,1835.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="1835.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">elif x * y &lt; 2:</text><text x="120.0" y="1739.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 13</text><polygon points="1440.0,1800.0 2200.0,1800.0 2200.0,1870.0 1440.0,1870.0" fill="white" stroke="black" stroke-width="1.7"/><text x="1820.0" y="1835.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">z = 2 ** (c * d) - x</text><text x="1440.0" y="1779.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 14</text><polygon points="240.0,2010.0 1000.0,2010.0 1000.0,2080.0 240.0,2080.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="2045.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">z = None</text><text x="240.0" y="1989.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 16</text><polygon points="240.0,2180.0 1000.0,2180.0 1000.0,2250.0 240.0,2250.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="2215.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">result = f&quot;x = {x}\ny = {y}\nc = {c}\nd = {d}&quot;</text><text x="240.0" y="2159.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 18</text><polygon points="620.0,2350.0 1120.0,2425.0 620.0,2500.0 120.0,2425.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="2425.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">if z is None:</text><text x="120.0" y="2329.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 19</text><polygon points="1440.0,2390.0 2200.0,2390.0 2200.0,2460.0 1440.0,2460.0" fill="white" stroke="black" stroke-width="1.7"/><text x="1820.0" y="2425.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">result += &quot;\nФормула для этих данных не задана.&quot;</text><text x="1440.0" y="2369.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 20</text><polygon points="240.0,2600.0 1000.0,2600.0 1000.0,2670.0 240.0,2670.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="2635.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">result += f&quot;\nРезультат = {z:.10g}&quot;</text><text x="240.0" y="2579.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 22</text><polygon points="231.0,2770.0 1045.0,2770.0 1009.0,2840.0 195.0,2840.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="2805.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">print(result)</text><text x="195.0" y="2749.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 23</text><polygon points="231.0,2940.0 1045.0,2940.0 1009.0,3030.0 195.0,3030.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="2970.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">with open(&quot;result.txt&quot;, &quot;w&quot;, encoding=&quot;utf-8&quot;) </text><text x="620.0" y="2999.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">↪ as file:</text><text x="195.0" y="2919.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 24</text><polygon points="231.0,3130.0 1045.0,3130.0 1009.0,3200.0 195.0,3200.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="3165.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">file.write(result + &quot;\n&quot;)</text><text x="195.0" y="3109.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 25</text><polygon points="240.0,3300.0 1000.0,3300.0 1000.0,3390.0 240.0,3390.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="3330.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">Выход из with (стр. 24)</text><text x="620.0" y="3359.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">Автоматическое закрытие файла</text><rect x="355.0" y="3490.0" width="530" height="70" rx="35.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="3525.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">Конец</text><text x="1280.0" y="1316.0" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Да</text><text x="638.0" y="1437.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">Нет</text><text x="1280.0" y="1566.0" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Да</text><text x="638.0" y="1687.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">Нет</text><text x="1280.0" y="1816.0" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Да</text><text x="638.0" y="1937.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">Нет · else:</text><text x="1280.0" y="2406.0" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Да</text><text x="638.0" y="2527.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">Нет · else:</text><text x="1390.0" y="3785" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Номера строк соответствуют листингу отчёта. L — парные границы цикла.</text></svg>