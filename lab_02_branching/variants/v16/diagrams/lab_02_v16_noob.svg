" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="785.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">a = 1.0</text><text x="240.0" y="729.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 3</text><polygon points="240.0,920.0 1000.0,920.0 1000.0,990.0 240.0,990.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="955.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">c = 2.0</text><text x="240.0" y="899.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 4</text><polygon points="240.0,1090.0 1000.0,1090.0 1000.0,1160.0 240.0,1160.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="1125.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">d = 3.0</text><text x="240.0" y="1069.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 5</text><polygon points="620.0,1260.0 1120.0,1335.0 620.0,1410.0 120.0,1335.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="1335.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">if x &gt; 3 and x * y &lt; 2:</text><text x="120.0" y="1239.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 7</text><polygon points="1440.0,1300.0 2200.0,1300.0 2200.0,1370.0 1440.0,1370.0" fill="white" stroke="black" stroke-width="1.7"/><text x="1820.0" y="1335.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">z = max(3 ** (x + a), c + d, min(x, a))</text><text x="1440.0" y="1279.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 8</text><polygon points="620.0,1510.0 1120.0,1585.0 620.0,1660.0 120.0,1585.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="1585.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">elif x &gt; 3 and x * y &gt; 2:</text><text x="120.0" y="1489.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 9</text><polygon points="1440.0,1550.0 2200.0,1550.0 2200.0,1620.0 1440.0,1620.0" fill="white" stroke="black" stroke-width="1.7"/><text x="1820.0" y="1585.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">z = min(x, a, c, y, d)</text><text x="1440.0" y="1529.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 10</text><polygon points="240.0,1760.0 1000.0,1760.0 1000.0,1830.0 240.0,1830.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="1795.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">z = c + d * x</text><text x="240.0" y="1739.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 12</text><polygon points="231.0,1930.0 1045.0,1930.0 1009.0,2049.0 195.0,2049.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="1960.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">print(&quot;x = &quot; + str(x) + &quot;, &quot; + &quot;y = &quot; + str(y) +</text><text x="620.0" y="1989.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">↪  &quot;, &quot; + &quot;a = &quot; + str(a) + &quot;, &quot; + &quot;c = &quot; + str(c)</text><text x="620.0" y="2018.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">↪  + &quot;, &quot; + &quot;d = &quot; + str(d))</text><text x="195.0" y="1909.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 14</text><polygon points="620.0,2149.0 1120.0,2224.0 620.0,2299.0 120.0,2224.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="2224.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">if z is None:</text><text x="120.0" y="2128.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 15</text><polygon points="1431.0,2189.0 2245.0,2189.0 2209.0,2259.0 1395.0,2259.0" fill="white" stroke="black" stroke-width="1.7"/><text x="1820.0" y="2224.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">print(&quot;Формула для этих данных не задана.&quot;)</text><text x="1395.0" y="2168.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 16</text><polygon points="231.0,2399.0 1045.0,2399.0 1009.0,2469.0 195.0,2469.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="2434.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">print(&quot;Результат = &quot; + str(z))</text><text x="195.0" y="2378.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 18</text><rect x="355.0" y="2569.0" width="530" height="70" rx="35.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="2604.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">Конец</text><text x="1280.0" y="1316.0" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Да</text><