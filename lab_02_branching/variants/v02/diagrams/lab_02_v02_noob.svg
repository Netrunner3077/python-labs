w)"/><polyline points="620.0,1660.0 620.0,1760.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="1120.0,1835.0 1413.0,1835.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,1910.0 620.0,2010.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="1820.0,1870.0 1820.0,2132 620.0,2132 620.0,2180.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,2080.0 620.0,2180.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="355.0" y="240.0" width="530" height="70" rx="35.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="275.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">Начало</text><polygon points="240.0,410.0 1000.0,410.0 1000.0,480.0 240.0,480.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="445.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">from math import exp, log, sin</text><text x="240.0" y="389.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 1</text><polygon points="240.0,580.0 1000.0,580.0 1000.0,650.0 240.0,650.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="615.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">x = 2.0</text><text x="240.0" y="559.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 4</text><polygon points="240.0,750.0 1000.0,750.0 1000.0,820.0 240.0,820.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="785.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">y = 0.5</text><text x="240.0" y="729.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 5</text><polygon points="620.0,920.0 1120.0,995.0 620.0,1070.0 120.0,995.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="995.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">if 2 &lt; x + y &lt; 3:</text><text x="120.0" y="899.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 7</text><polygon points="1440.0,960.0 2200.0,960.0 2200.0,1030.0 1440.0,1030.0" fill="white" stroke="black" stroke-width="1.7"/><text x="1820.0" y="995.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">z = 4 * min(5 ** (2 + x), x + y, -4 * y)</text><text x="1440.0" y="939.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 8</text><polygon points="620.0,1170.0 1120.0,1245.0 620.0,1320.0 120.0,1245.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="1245.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">elif x + y &gt; 3:</text><text x="120.0" y="1149.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 9</text><polygon points="1440.0,1210.0 2200.0,1210.0 2200.0,1280.0 1440.0,1280.0" fill="white" stroke="black" stroke-width="1.7"/><text x="1820.0" y="1245.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">z = max(exp(x - y), 3 * log(x), min(x, y))</text><text x="1440.0" y="1189.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 10</text><polygon points="240.0,1420.0 1000.0,1420.0 1000.0,1490.0 240.0,1490.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="1455.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">z = 3.2 * sin(x * y) * max(x, y)</text><text x="240.0" y="1399.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 12</text><polygon points="231.0,1590.0 1045.0,1590.0 1009.0,1660.0 195.0,1660.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="1625.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">print(&quot;x = &quot; + str(x) + &quot;, &quot; + &quot;y = &quot; + str(y))</text><text x="195.0" y="1569.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 14</text><polygon points="620.0,1760.0 1120.0,1835.0 620.0,1910.0 120.0,1835.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="1835.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">if z is None:</text><text x="120.0" y="1739.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 15</text><polygon points="1431.0,1800.0 2245.0,1800.0 2209.0,1870.0 1395.0,1870.0" fill="white" stroke="black" stroke-width="1.7"/><text x="1820.0" y="1835.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">print(&quot;Формула для этих данных не задана.&quot;)</text><text x="1395.0" y="1779.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 16</text><polygon points="231.0,2010.0 1045.0,2010.0 1009.0,2080.0 195.0,2080.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="2045.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">print(&quot;Результат = &quot; + str(z))</text><text x="195.0" y="1989.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 18</text><rect x="355.0" y="2180.0" width="530" height="70" rx="35.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="2215.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">Конец</text><text x="1280.0" y="976.0" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Да</text><text x="638.0" y="1097.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">Нет</text><text x="1280.0" y="1226.0" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Да</text><text x="638.0" y="1347.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">Нет · else:</text><text x="1266.5" y="1816.0" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Да</text><text x="638.0" y="1937.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">Нет · else:</text><text x="1412.5" y="2475" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Номера строк соответствуют листингу отчёта. L — парные границы цикла.</text></svg>