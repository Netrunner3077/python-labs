"1.7"/><text x="620.0" y="615.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">x = float(input(&quot;Введите x: &quot;))</text><text x="195.0" y="559.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 4</text><polygon points="231.0,750.0 1045.0,750.0 1009.0,820.0 195.0,820.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="785.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">a = float(input(&quot;Введите a: &quot;))</text><text x="195.0" y="729.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 5</text><polygon points="231.0,920.0 1045.0,920.0 1009.0,990.0 195.0,990.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="955.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">b = float(input(&quot;Введите b: &quot;))</text><text x="195.0" y="899.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 6</text><polygon points="620.0,1090.0 1120.0,1165.0 620.0,1240.0 120.0,1165.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="1165.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">if a &gt; 0 and x &gt; 1:</text><text x="120.0" y="1069.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 8</text><polygon points="1440.0,1130.0 2200.0,1130.0 2200.0,1200.0 1440.0,1200.0" fill="white" stroke="black" stroke-width="1.7"/><text x="1820.0" y="1165.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">z = max(a, x / a, sin(a))</text><text x="1440.0" y="1109.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 9</text><polygon points="620.0,1340.0 1120.0,1415.0 620.0,1490.0 120.0,1415.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="1415.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">elif a &lt; 0 and x &gt; 1:</text><text x="120.0" y="1319.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 10</text><polygon points="1440.0,1380.0 2200.0,1380.0 2200.0,1450.0 1440.0,1450.0" fill="white" stroke="black" stroke-width="1.7"/><text x="1820.0" y="1415.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">z = min(a, a * x + sin(b), max(a, b))</text><text x="1440.0" y="1359.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 11</text><polygon points="240.0,1590.0 1000.0,1590.0 1000.0,1660.0 240.0,1660.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="1625.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">z = max(a, b)</text><text x="240.0" y="1569.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 13</text><polygon points="240.0,1760.0 1000.0,1760.0 1000.0,1830.0 240.0,1830.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="1795.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">result = f&quot;x = {x}\na = {a}\nb = {b}&quot;</text><text x="240.0" y="1739.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 15</text><polygon points="620.0,1930.0 1120.0,2005.0 620.0,2080.0 120.0,2005.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="2005.0" font-size="