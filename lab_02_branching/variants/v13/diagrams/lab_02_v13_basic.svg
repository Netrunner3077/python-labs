t-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">↪ as file:</text><text x="195.0" y="2499.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 21</text><polygon points="231.0,2710.0 1045.0,2710.0 1009.0,2780.0 195.0,2780.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="2745.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">file.write(result + &quot;\n&quot;)</text><text x="195.0" y="2689.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 22</text><polygon points="240.0,2880.0 1000.0,2880.0 1000.0,2970.0 240.0,2970.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="2910.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">Выход из with (стр. 21)</text><text x="620.0" y="2939.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">Автоматическое закрытие файла</text><rect x="355.0" y="3070.0" width="530" height="70" rx="35.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="3105.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">Конец</text><text x="1280.0" y="1146.0" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Да</text><text x="638.0" y="1267.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">Нет</text><text x="1280.0" y="1396.0" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Да</text><text x="638.0" y="1517.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">Нет · else:</text><text x="1280.0" y="198