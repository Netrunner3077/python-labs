<svg xmlns="http://www.w3.org/2000/svg" width="2780.0" height="3220" viewBox="0 0 2780.0 3220"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="black"/></marker></defs><text x="1390.0" y="35" font-size="30" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Лабораторная работа №2 · Вариант №5 · basic</text><text x="1390.0" y="80" font-size="24" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Блок-схема по листингу из отчёта</text><polyline points="620.0,310.0 620.0,410.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,480.0 620.0,580.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,650.0 620.0,750.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,820.0 620.0,920.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="1120.0,995.0 1440.0,995.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,1070.0 620.0,1170.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="2200.0,995.0 2550.0,995.0 2550.0,1625.0 1000.0,1625.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="1120.0,1245.0 1440.0,1245.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,1320.0 620.0,1420.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="1820.0,1280.0 1820.0,1542 620.0,1542 620.0,1590.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,1490.0 620.0,1590.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,1660.0 620.0,1760.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="1120.0,1835.0 1440.0,1835.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,1910.0 620.0,2010.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="1820.0,1870.0 1820.0,2132 620.0,2132 620.0,2180.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,2080.0 620.0,2180.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,2250.0 620.0,2350.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,2440.0 620.0,2540.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,2610.0 620.0,2710.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><polyline points="620.0,2800.0 620.0,2900.0" fill="none" stroke="black" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="355.0" y="240.0" width="530" height="70" rx="35.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="275.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">Начало</text><polygon points="240.0,410.0 1000.0,410.0 1000.0,480.0 240.0,480.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="445.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">from math import exp, log, sin</text><text x="240.0" y="389.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 1</text><polygon points="231.0,580.0 1045.0,580.0 1009.0,650.0 195.0,650.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="615.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">x = float(input(&quot;Введите x: &quot;))</text><text x="195.0" y="559.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 4</text><polygon points="231.0,750.0 1045.0,750.0 1009.0,820.0 195.0,820.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="785.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">y = float(input(&quot;Введите y: &quot;))</text><text x="195.0" y="729.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 5</text><polygon points="620.0,920.0 1120.0,995.0 620.0,1070.0 120.0,995.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="995.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">if 2 &lt; x + y &lt; 3:</text><text x="120.0" y="899.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 7</text><polygon points="1440.0,960.0 2200.0,960.0 2200.0,1030.0 1440.0,1030.0" fill="white" stroke="black" stroke-width="1.7"/><text x="1820.0" y="995.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">z = 4 * min(5 ** (3 + x), x + y, -4 * y)</text><text x="1440.0" y="939.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 8</text><polygon points="620.0,1170.0 1120.0,1245.0 620.0,1320.0 120.0,1245.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="1245.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">elif x + y &gt; 3:</text><text x="120.0" y="1149.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 9</text><polygon points="1440.0,1210.0 2200.0,1210.0 2200.0,1280.0 1440.0,1280.0" fill="white" stroke="black" stroke-width="1.7"/><text x="1820.0" y="1245.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">z = max(exp(x - y), 3 * log(x), min(x, y))</text><text x="1440.0" y="1189.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 10</text><polygon points="240.0,1420.0 1000.0,1420.0 1000.0,1490.0 240.0,1490.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="1455.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">z = 2.5 * sin(x * y) * max(x, y)</text><text x="240.0" y="1399.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 12</text><polygon points="240.0,1590.0 1000.0,1590.0 1000.0,1660.0 240.0,1660.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="1625.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">result = f&quot;x = {x}\ny = {y}&quot;</text><text x="240.0" y="1569.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 14</text><polygon points="620.0,1760.0 1120.0,1835.0 620.0,1910.0 120.0,1835.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="1835.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">if z is None:</text><text x="120.0" y="1739.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 15</text><polygon points="1440.0,1800.0 2200.0,1800.0 2200.0,1870.0 1440.0,1870.0" fill="white" stroke="black" stroke-width="1.7"/><text x="1820.0" y="1835.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">result += &quot;\nФормула для этих данных не задана.&quot;</text><text x="1440.0" y="1779.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 16</text><polygon points="240.0,2010.0 1000.0,2010.0 1000.0,2080.0 240.0,2080.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="2045.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">result += f&quot;\nРезультат = {z:.10g}&quot;</text><text x="240.0" y="1989.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 18</text><polygon points="231.0,2180.0 1045.0,2180.0 1009.0,2250.0 195.0,2250.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="2215.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">print(result)</text><text x="195.0" y="2159.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 19</text><polygon points="231.0,2350.0 1045.0,2350.0 1009.0,2440.0 195.0,2440.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="2380.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">with open(&quot;result.txt&quot;, &quot;w&quot;, encoding=&quot;utf-8&quot;) </text><text x="620.0" y="2409.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">↪ as file:</text><text x="195.0" y="2329.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 20</text><polygon points="231.0,2540.0 1045.0,2540.0 1009.0,2610.0 195.0,2610.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="2575.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">file.write(result + &quot;\n&quot;)</text><text x="195.0" y="2519.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 21</text><polygon points="240.0,2710.0 1000.0,2710.0 1000.0,2800.0 240.0,2800.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="2740.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">Выход из with (стр. 20)</text><text x="620.0" y="2769.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">Автоматическое закрытие файла</text><rect x="355.0" y="2900.0" width="530" height="70" rx="35.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="2935.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">Конец</text><text x="1280.0" y="976.0" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Да</text><text x="638.0" y="1097.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">Нет</text><text x="1280.0" y="1226.0" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Да</text><text x="638.0" y="1347.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">Нет · else:</text><text x="1280.0" y="1816.0" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Да</text><text x="638.0" y="1937.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">Нет · else:</text><text x="1390.0" y="3195" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Номера строк соответствуют листингу отчёта. L — парные границы цикла.</text></svg>