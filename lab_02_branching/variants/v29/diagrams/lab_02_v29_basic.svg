text><text x="240.0" y="389.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 1</text><polygon points="231.0,580.0 1045.0,580.0 1009.0,650.0 195.0,650.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="615.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">x = float(input(&quot;Введите x: &quot;))</text><text x="195.0" y="559.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 4</text><polygon points="231.0,750.0 1045.0,750.0 1009.0,820.0 195.0,820.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="785.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">y = float(input(&quot;Введите y: &quot;))</text><text x="195.0" y="729.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 5</text><polygon points="231.0,920.0 1045.0,920.0 1009.0,990.0 195.0,990.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="955.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">a = float(input(&quot;Введите a: &quot;))</text><text x="195.0" y="899.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 6</text><polygon points="231.0,1090.0 1045.0,1090.0 1009.0,1160.0 195.0,1160.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="1125.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">c = float(input(&quot;Введите c: &quot;))</text><text x="195.0" y="1069.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 7</text><polygon points="231.0,1260.0 1045.0,1260.0 1009.0,1330.0 195.0,1330.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="1295.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">d = float(input(&quot;Введите d: &quot;))</text><text x="195.0" y="1239.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 8</text><polygon points="620.0,1430.0 1120.0,1505.0 620.0,1580.0 120.0,1505.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="1505.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">if 0 &lt; x &lt; 1 and 0 &lt; y &lt; 1:</text><text x="120.0" y="1409.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 10</text><polygon points="1440.0,1460.0 2200.0,1460.0 2200.0,1550.0 1440.0,1550.0" fill="white" stroke="black" stroke-width="1.7"/><text x="1820.0" y="1490.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">z = 2 * log(x) * max(min(x, y), sin(c * x), </text><text x="1820.0" y="1519.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">↪ cos(d))</text><text x="1440.0" y="1439.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 11</text><polygon points="620.0,1680.0 1120.0,1755.0 620.0,1830.0 120.0,1755.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="1755.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">elif x &lt; 0 and y &lt; 0:</text><text x="120.0" y="1659.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 12</text><polygon points="1440.0,1720.0 2200.0,1720.0 2200.0,1790.0 1440.0,1790.0" fill="white" stroke="black" stroke-width="1.7"/><text x="1820.0" y="1755.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">z = min(exp(x + 1), y)</text><text x="1440.0" y="1699.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 13</text><polygon points="240.0,1930.0 1000.0,1930.0 1000.0,2000.0 240.0,2000.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="1965.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">z = a + x</text><text x="240.0" y="1909.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 15</text><polygon points="240.0,2100.0 1000.0,2100.0 1000.0,2190.0 240.0,2190.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="2130.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">result = f&quot;x = {x}\ny = {y}\na = {a}\nc = {c}\nd</text><text x="620.0" y="2159.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">↪  = {d}&quot;</text><text x="240.0" y="2079.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 17</text><polygon points="620.0,2290.0 1120.0,2365.0 620.0,2440.0 120.0,2365.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="2365.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">if z is None:</text><text x="120.0" y="2269.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 18</text><polygon points="1440.0,2330.0 2200.0,2330.0 2200.0,2400.0 1440.0,2400.0" fill="white" stroke="black" stroke-width="1.7"/><text x="1820.0" y="2365.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">result += &quot;\nФормула для этих данных не задана.&quot;</text><text x="1440.0" y="2309.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 19</text><polygon points="240.0,2540.0 1000.0,2540.0 1000.0,2610.0 240.0,2610.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="2575.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">result += f&quot;\nРезультат = {z:.10g}&quot;</text><text x="240.0" y="2519.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 21</text><polygon points="231.0,2710.0 1045.0,2710.0 1009.0,2780.0 195.0,2780.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="2745.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">print(result)</text><text x="195.0" y="2689.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 22</text><polygon points="231.0,2880.0 1045.0,2880.0 1009.0,2970.0 195.0,2970.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="2910.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">with open(&quot;result.txt&quot;, &quot;w&quot;, encoding=&quot;utf-8&quot;) </text><text x="620.0" y="2939.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">↪ as file:</text><text x="195.0" y="2859.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 23</text><polygon points="231.0,3070.0 1045.0,3070.0 1009.0,3140.0 195.0,3140.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="3105.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">file.write(result + &quot;\n&quot;)</text><text x="195.0" y="3049.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 24</text><polygon points="240.0,3240.0 1000.0,3240.0 1000.0,3330.0 240.0,3330.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="3270.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">Выход из with (стр. 23)</text><text x="620.0" y="3299.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">Автоматическое закрытие файла</text><rect x="355.0" y="3430.0" width="530" height="70" rx="35.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="3465.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">Конец</text><text x="1280.0" y="1486.0" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Да</text><text x="638.0" y="1607.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">Нет</text><text x="1280.0" y="1736.0" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Да</text><text x="638.0" y="1857.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">Нет · else:</text><text x="1280.0" y="2346.0" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Да</text><text x="638.0" y="2467.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">Нет · else:</text><text x="1390.0" y="3725" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Номера строк соответствуют листингу отчёта. L — парные границы цикла.</text></svg>