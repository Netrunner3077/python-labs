 y="1489.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 12</text><polygon points="231.0,1680.0 1045.0,1680.0 1009.0,1799.0 195.0,1799.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="1710.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">print(&quot;x = &quot; + str(x) + &quot;, &quot; + &quot;y = &quot; + str(y) +</text><text x="620.0" y="1739.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">↪  &quot;, &quot; + &quot;a = &quot; + str(a) + &quot;, &quot; + &quot;b = &quot; + </text><text x="620.0" y="1768.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">↪ str(b))</text><text x="195.0" y="1659.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 14</text><polygon points="620.0,1899.0 1120.0,1974.0 620.0,2049.0 120.0,1974.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="1974.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">if z is None:</text><text x="120.0" y="1878.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 15</text><polygon points="1431.0,1939.0 2245.0,1939.0 2209.0,2009.0 1395.0,2009.0" fill="white" stroke="black" stroke-width="1.7"/><text x="1820.0" y="1974.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">print(&quot;Формула для этих данных не задана.&quot;)</text><text x="1395.0" y="1918.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 16</text><polygon points="231.0,2149.0 1045.0,2149.0 1009.0,2219.0 195.0,2219.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="2184.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">print(&quot;Результат = &quot; + str(z))</text><text x="195.0" y="2128.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 18</text><rect x="355.0" y="2319.0" width="530" height="70" rx="35.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="2354.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">Конец</text><text x="1280.0" y="1316.0" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Да</text><text x="638.0" y="1437.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">Нет · else:</text><text x="1266.5" y="1955.0" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Да</text><text x="638.0" y="2076.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">Нет · else:</text><text x="1237.5" y="2614" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Номера строк соответствуют листингу отчёта. L — парные границы цикла.</text></svg>