"black" stroke-width="1.7"/><text x="620.0" y="445.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">import math</text><text x="240.0" y="389.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 1</text><polygon points="231.0,580.0 1045.0,580.0 1009.0,650.0 195.0,650.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="615.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">x = float(input(&quot;Введите x: &quot;))</text><text x="195.0" y="559.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 3</text><polygon points="231.0,750.0 1045.0,750.0 1009.0,820.0 195.0,820.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="785.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">y = float(input(&quot;Введите y: &quot;))</text><text x="195.0" y="729.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 4</text><polygon points="231.0,920.0 1045.0,920.0 1009.0,990.0 195.0,990.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="955.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">a = float(input(&quot;Введите a: &quot;))</text><text x="195.0" y="899.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 5</text><polygon points="231.0,1090.0 1045.0,1090.0 1009.0,1160.0 195.0,1160.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="1125.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">c = float(input(&quot;Введите c: &quot;))</text><text x="195.0" y="1069.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 6</text><polygon points="231.0,1260.0 1045.0,1260.0 1009.0,1330.0 195.0,1330.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="1295.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">d = float(input(&quot;Введите d: &quot;))</text><text x="195.0" y="1239.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 7</text><polygon points="620.0,1430.0 1120.0,1505.0 620.0,1580.0 120.0,1505.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="1505.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">if 0 &lt; x &lt; 1 and 0 &lt; y &lt; 1:</text><text x="120.0" y="1409.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 9</text><polygon points="1440.0,1460.0 2200.0,1460.0 2200.0,1550.0 1440.0,1550.0" fill="white" stroke="black" stroke-width="1.7"/><text x="1820.0" y="1490.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">b = 2 * math.log(x) * max(min(x, y), math.sin(c </text><text x="1820.0" y="1519.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">↪ * x), math.cos(d))</text><text x="1440.0" y="1439.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 10</text><polygon points="620.0,1680.0 1120.0,1755.0 620.0,1830.0 120.0,1755.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="1755.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">elif x &lt; 0 and y &lt; 0:</text><text x="120.0" y="1659.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 11</text><polygon points="1440.0,1720.0 2200.0,1720.0 2200.0,1790.0 1440.0,1790.0" fill="white" stroke="black" stroke-width="1.7"/><text x="1820.0" y="1755.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">b = min(math.exp(x + 1), y)</text><text x="1440.0" y="1699.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 12</text><polygon points="240.0,1930.0 1000.0,1930.0 1000.0,2000.0 240.0,2000.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="1965.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">b = a + x</text><text x="240.0" y="1909.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 14</text><polygon points="231.0,2100.0 1045.0,2100.0 1009.0,2170.0 195.0,2170.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="2135.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">print(&quot;Исходные данные:&quot;)</text><text x="195.0" y="2079.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 16</text><polygon points="231.0,2270.0 1045.0,2270.0 1009.0,2360.0 195.0,2360.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="2300.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">print(f&quot;  x = {x}, y = {y}, a = {a}, c = {c}, d </text><text x="620.0" y="2329.5" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">↪ = {d}&quot;)</text><text x="195.0" y="2249.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 17</text><polygon points="231.0,2460.0 1045.0,2460.0 1009.0,2530.0 195.0,2530.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="2495.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">print(f&quot;Результат: b = {b}&quot;)</text><text x="195.0" y="2439.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 18</text><polygon points="231.0,2630.0 1045.0,2630.0 1009.0,2700.0 195.0,2700.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="2665.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">f = open(&quot;result.txt&quot;, &quot;w&quot;)</text><text x="195.0" y="2609.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 20</text><polygon points="231.0,2800.0 1045.0,2800.0 1009.0,2870.0 195.0,2870.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="2835.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">f.write(f&quot;x = {x}\n&quot;)</text><text x="195.0" y="2779.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 21</text><polygon points="231.0,2970.0 1045.0,2970.0 1009.0,3040.0 195.0,3040.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="3005.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">f.write(f&quot;y = {y}\n&quot;)</text><text x="195.0" y="2949.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 22</text><polygon points="231.0,3140.0 1045.0,3140.0 1009.0,3210.0 195.0,3210.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="3175.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">f.write(f&quot;a = {a}\n&quot;)</text><text x="195.0" y="3119.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 23</text><polygon points="231.0,3310.0 1045.0,3310.0 1009.0,3380.0 195.0,3380.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="3345.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">f.write(f&quot;c = {c}\n&quot;)</text><text x="195.0" y="3289.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 24</text><polygon points="231.0,3480.0 1045.0,3480.0 1009.0,3550.0 195.0,3550.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="3515.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">f.write(f&quot;d = {d}\n&quot;)</text><text x="195.0" y="3459.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 25</text><polygon points="231.0,3650.0 1045.0,3650.0 1009.0,3720.0 195.0,3720.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="3685.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">f.write(f&quot;b = {b}\n&quot;)</text><text x="195.0" y="3629.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 26</text><polygon points="240.0,3820.0 1000.0,3820.0 1000.0,3890.0 240.0,3890.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="3855.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">f.close()</text><text x="240.0" y="3799.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">стр. 27</text><rect x="355.0" y="3990.0" width="530" height="70" rx="35.0" fill="white" stroke="black" stroke-width="1.7"/><text x="620.0" y="4025.0" font-size="24" font-family="Consolas, Segoe UI Symbol" text-anchor="middle" dominant-baseline="central" fill="black">Конец</text><text x="1280.0" y="1486.0" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Да</text><text x="638.0" y="1607.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">Нет</text><text x="1280.0" y="1736.0" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Да</text><text x="638.0" y="1857.0" font-size="18" font-family="Arial" text-anchor="start" dominant-baseline="central" fill="black">Нет · else:</text><text x="1390.0" y="4285" font-size="18" font-family="Arial" text-anchor="middle" dominant-baseline="central" fill="black">Номера строк соответствуют листингу отчёта. L — парные границы цикла.</text></svg>