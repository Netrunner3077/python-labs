[project]
name = "python-labs"
version = "1.0.0"
description = "Лабораторные работы по Python (варианты 1–30)"
requires-python = ">=3.10"
authors = [{ name = "Токарев В.С." }]

[tool.pytest.ini_options]
testpaths = ["lab_01_linear_function/variants",
             "lab_02_branching/variants",
             "lab_03_loops/variants",
             "lab_04_arrays/variants"]
python_files = "test_*.py"
addopts = "-v --tb=short --import-mode=importlib -p qa_support.conftest --ignore=qa_support"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
